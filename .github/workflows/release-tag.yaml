# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/, and anything under tests/), so it works regardless of
# the repo's directory layout.
#
# `tests/` IS PRUNED BECAUSE A CHART THERE MUST NEVER SHIP. tests/compositions/no-create-rollup is a
# probe whose own header says "PROBE ONLY -- NEVER SHIPPED, NEVER PUBLISHED". Without this prune the
# channel guard below DISCOVERS it, finds values.schema.json but no CompositionDefinition, and fails
# the release with "Not every chart here belongs in `blueprints`" -- correct behaviour from a guard
# that never anticipated a chart which must not ship at all.
#
# Nothing was ever published: the probe chart was added 2026-11-18 and the newest tag is 0.4.0 from
# 2026-11-14 (`git merge-base --is-ancestor` confirms it postdates it). The next tag push would have
# been the first to see it, and would have failed rather than published -- the better of the two
# failures, and still a blocked release.
#
# release-oci 2.0.0 prunes a WIDER list (examples, fixtures, testdata, test, tests, e2e, sample,
# samples, docs, node_modules), so the migration inherits this and more. This narrower fix exists so
# the repo does not carry a known-broken next release while that migration waits.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
#
# SCHEDULED FOR DELETION, and do not "improve" it in the meantime. This file is a
# repository-specific release, which R5 of krateo-blueprints' REPOSITORY.md says should be
# the shared krateo-platformops/.github release-oci. That is agreed, not resisted -- it was
# advisory only because release-oci was missing guards this file has, and those are being
# closed rather than exempted.
#
# WHAT GATES THE SWAP: release-oci 2.0.0, tracked as krateo-platformops/.github issues
# #71-#73. NOT 1.1.0, which is already merged (f6185ef0a816, 2026-11-22) and already carries
# the two criteria this file's existence rested on -- a structural preflight-before-push
# (package-and-push `needs:` the preflight job, so it cannot be raced by step order, which
# is stronger than what this file does) and the top-level release-notes pattern documented
# at its own :109-111. Verified at that SHA, with a control: release-preflight appears 6
# times, `jobs:` once, and CHARTS_PUBLISH_TOKEN still 0 -- which is why 1.1.0 is not enough.
#
# Reviewed against this file's five pre-push checks; two were already covered and three
# were not:
#
#   1. no pre-push check that the INDEX-publishing credential exists -- the push uses
#      GITHUB_TOKEN and indexing is downstream, so "pushed but never indexed" stayed
#      reachable (the shape of github-provider-kog#111)
#   2. no check that the token carries no whitespace -- a trailing newline fails the
#      publisher with "Malformed input to a URL function" AFTER the push, half-publishing
#   3. no channel qualification before the push -- values.schema.json, a
#      CompositionDefinition in the dir or its parent, and refusing a `page-set` chart in
#      `blueprints`
#
# All three are being closed in release-oci 2.0.0: the publisher's content gate becomes a
# shared action called by BOTH publish-chart and release-oci (so (3) runs pre-push against
# the publisher's own rules rather than a copy), with a REQUIRED `index_channel` input --
# explicit `none` for a chart deliberately left out of the index, so an omission cannot
# silently skip the credential check -- and an optional charts_publish_token tested for
# presence and whitespace only, never used and never logged.
#
# A green token check proves PRESENCE AND SHAPE, NOT VALIDITY: an expired or wrongly scoped
# token still fails at index time. That limit applies to this file's checks too.
#
# THIS REPO IS THE FIRST 2.0.0 ADOPTER, by agreement with acmp on 2026-11-22: one chart, no
# consumers installing it (installer confirmed with three controlled probes), and a reviewer
# who had just read the workflow line by line. A breaking release is better tested where the
# blast radius is a chart nobody installs. acmp sends the 2.0.0 PRE-RELEASE SHA before
# tagging it final, so the migration PR here is its first real caller -- which means a
# regression found here is found before anyone else pins it.
#
# WHEN 2.0.0 SHIPS, THE MIGRATION IS NOT A ONE-FILE SWAP. This workflow does THREE things
# and release-oci absorbs exactly two of them. Settled with acmp on 2026-11-22 after reading
# 2.0.0's jobs rather than assuming the scope:
#
#   package-and-push   -> GOES. Replaced by release-oci, and these five guards are deleted
#                         in the SAME change. Keeping them would be dead belt-and-braces
#                         drifting from the shared definition, the problem R5 exists to solve.
#   publish-to-index   -> GOES. Indexing moves INTO release-oci (a `collect` job pulling each
#                         chart BACK from GHCR at its version, so the index gets the
#                         registry's exact bytes rather than a repackage with fresh mtimes --
#                         PUBLISHING.md rule 1 -- then a publish-index job calling
#                         publish-chart). A caller that ALSO publishes would double-publish.
#   release assets     -> STAYS, in this repo, as a TOP-LEVEL job. release-oci does no
#                         GitHub-release asset handling at all (verified: 0 occurrences at
#                         3892b82c, against a working control).
#
# WHAT MUST NOT REGRESS, whoever does it:
#
#   * release-notes.yaml stays a TOP-LEVEL caller, and so does the release-assets job. A
#     called workflow's permissions are capped at its caller's and custom secrets are not
#     inherited down a nested call, so neither could write a release body from inside
#     release-oci -- which documents this as the pattern at its own :109-111.
#   * `hack/publish-release-assets.sh` KEEPS its documented race with release-notes over who
#     creates the GitHub release, including the run IDs in its comments. One of this repo's
#     releases won that race "with nothing to spare". Do not simplify it away because it
#     looks defensive; it is load-bearing and it was measured.
#   * `index_channel` is REQUIRED, and `oci_repo` MUST be set explicitly: its default is
#     oci://ghcr.io/krateo-platformops/charts while this repo publishes to krateo-blueprints.
#     SINCE 2026-11-22 THIS IS REFUSED RATHER THAN SILENT -- release-oci's index-preflight
#     rejects `index_channel: blueprints` or `pages` unless `oci_repo` is exactly
#     oci://ghcr.io/krateo-blueprints/charts, compared AS WRITTEN so an old-org spelling is
#     refused too. So the consequence of forgetting is a failed preflight, not a blueprint
#     published into another org's namespace. Set it anyway; do not rely on the refusal, and
#     note it does NOT cover `index_channel: none`, where no channel check runs.
#
# DO NOT PIN A SHA FROM MEMORY. 2.0.0 was merged once as 3892b82c and SUPERSEDED before
# anyone pinned it, precisely because this scope question had not been answered yet. Take
# the SHA from acmp at migration time, pin it as `@<sha> # main YYYY-MM-DD` with the
# COMMIT's date (pinned-uses accepts only `X.Y.Z` or `main YYYY-MM-DD` -- verified at this
# repo's pinned 1.4.3, not just at main), and note beside it that the form is transitional.
# acmp tags 2.0.0 on that same commit once this repo's release passes, after which only the
# comment changes.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  # contents: write — the stamped CompositionDefinition is attached to the release.
  # It is applied by hand and is not inside the packaged chart, so it must ship as a
  # release asset, not just live in the runner.
  contents: write
  packages: write

jobs:
  # PUBLISHING.md rule 12: the repository's last word before the release publishes anything.
  #
  # WHY IT IS NEEDED HERE SPECIFICALLY. This workflow's tag filter is
  # `[0-9]+.[0-9]+.[0-9]+`, which admits `0.015.0` -- all digits and dots. publish-chart
  # refuses a non-plain-X.Y.Z version under rule 13, but it runs at INDEX time, AFTER the
  # GHCR push. So such a tag today would push a chart that is then never indexed: published
  # and invisible, the worst of both. This job applies the same pattern BEFORE the push.
  #
  # It also runs `hack/release-preflight` if this repository grows one. There is none today,
  # and the job says so and passes rather than succeeding silently -- and if one appears but
  # loses its executable bit, it FAILS instead of being skipped exactly when it mattered.
  #
  # Named `release-preflight`, not `preflight`: the reusable's own job is `preflight`, and
  # two jobs of that name in one graph read as the same job in logs and in `needs:`.
  release-preflight:
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}

  package-and-push:
    # A block list, so a refused preflight stops the push rather than racing it.
    needs: [release-preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Stamp the CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of the chart it installs but is not a Chart.yaml, so the
          # per-chart stamp in the packaging step never touches it. Left by hand it drifts: the
          # chart advances with the tag while the CD keeps naming an older, eventually
          # unpublished, version. This workflow publishes every chart on every tag, so stamping
          # the CD to the same tag is always valid. examples/ CDs are left as pinned fixtures.
            #
            # It also RECORDS the set it stamps, because this is the last moment the tree is
            # pristine. The packaging step copies each CD into its chart directory so the
            # archive is self-describing, and a later `find` then sees the original AND that
            # copy. That is how 0.3.0 attached two byte-identical assets --
            # compositiondefinition-compositions.yaml and
            # compositiondefinition-aruba-network-environment.yaml -- for one object.
            echo "CD_MANIFEST=${RUNNER_TEMP}/cd-manifest" >> "$GITHUB_ENV"
            export CD_MANIFEST="${RUNNER_TEMP}/cd-manifest"
            : > "${CD_MANIFEST}"
          find . -type f -name compositiondefinition.yaml \
                 -not -path '*/charts/*' -not -path '*/examples/*' -not -path '*/samples/*' \
                 -not -path '*/tests/*' -print0 \
            | while IFS= read -r -d '' cd; do
                sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"
                  printf '%s\0' "$cd" >> "${CD_MANIFEST}"
              done

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # Checked BEFORE anything is pushed. Without it the GHCR push would succeed and
          # the index publish would not, which is the state the publishing standard exists
          # to prevent: a chart in GHCR and absent from the index is not published, because
          # the Marketplace installs from the index and never re-resolves against GHCR.
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release cannot reach"
            echo "::error::the helm index and the Marketplace would never list it. Failing now,"
            echo "::error::before the GHCR push, rather than publishing half of a release."
            exit 1
          fi
          # PRESENT AND AUTHENTICATING IS NOT ENOUGH. publish-chart.yaml 1.0.0 interpolates
          # this token into a git clone URL, so a value carrying whitespace -- a trailing
          # newline from a paste is the usual way -- produces
          #
          #   fatal: ... URL rejected: Malformed input to a URL function
          #
          # at the publisher's "Clone gh-pages" step. Measured, not hypothesised:
          # github-provider-kog 0.7.6 (run 42411357647) failed exactly there on
          # 2026-11-07 and was left half-published, because its caller had already pushed
          # to GHCR.
          #
          # An API check cannot see this. The token AUTHENTICATES fine -- `gh api` strips
          # nothing and needs nothing stripped, because the value never reaches a URL. The
          # defect is in how the publisher USES it, and it is invisible to every check that
          # only asks whether the credential works. So this gate asserts the SHAPE of the
          # value as well as its power, which is the only check that runs before the push.
          #
          # A GitHub token contains no whitespace anywhere, so stripping all of it and
          # comparing is exact: it catches leading, trailing and embedded alike. The value
          # is never echoed; only the comparison's outcome is.
          if [ "${CHARTS_PUBLISH_TOKEN}" != "$(printf '%s' "${CHARTS_PUBLISH_TOKEN}" | tr -d '[:space:]')" ]; then
            echo "::error::CHARTS_PUBLISH_TOKEN contains whitespace. No GitHub token does, so the"
            echo "::error::secret was almost certainly stored with a trailing newline. The publisher"
            echo "::error::puts this value in a git URL and fails with 'Malformed input to a URL"
            echo "::error::function' AFTER the GHCR push, leaving the release half-published."
            echo "::error::Re-create the secret with no trailing newline: printf '%s' \"\$TOKEN\" | gh secret set ..."
            echo "::error::Failing now, before anything is pushed."
            exit 1
          fi

      - name: Every chart here must qualify for the `blueprints` channel
        run: |
          set -euo pipefail
          # The standard says the channel follows from the CONTENT, not from preference:
          # `blueprints` for a chart with values.schema.json AND a CompositionDefinition,
          # `pages` for one annotated `krateo.io/kind: page-set`, and `operators` for
          # everything else. The publisher refuses a mismatch -- but it refuses AFTER the
          # caller has already pushed to GHCR, which is the half-published state rule 1
          # exists to prevent, so the caller checks first.
          #
          # This repo passes a single `channel: blueprints` to the reusable workflow, which
          # is correct only while every chart here is a blueprint. Asserted rather than
          # assumed, so adding an operator or CRD chart later fails the release with the
          # reason instead of silently filing it in the wrong channel.
          bad=0
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            [ -f "$dir/values.schema.json" ] || { echo "::error::${name}: no values.schema.json"; bad=1; }
            if [ ! -f "$dir/compositiondefinition.yaml" ] && [ ! -f "$(dirname "$dir")/compositiondefinition.yaml" ]; then
              echo "::error::${name}: no CompositionDefinition in the chart dir or its parent"; bad=1
            fi
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path '*/tests/*' -print0)
          # A page-set is a different channel, not a defective blueprint, so say so.
          while IFS= read -r -d '' cf; do
            grep -q "krateo.io/kind:[[:space:]]*page-set" "$cf" && {
              echo "::error::$(dirname "$cf") is annotated page-set, which belongs in the"
              echo "::error::\`pages\` channel, not \`blueprints\`."; bad=1; }
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path '*/tests/*' -print0)
          [ "$bad" = "0" ] || {
            echo "::error::Not every chart here belongs in \`blueprints\`. This caller passes"
            echo "::error::ONE channel for all its charts, so split the release by channel"
            echo "::error::first. Failing before the GHCR push, not at the publisher."
            exit 1; }
          echo "every chart qualifies for the blueprints channel"

      - name: Locate the shared chart-push script
        id: chart-push
        # krateo-blueprints/charts PUBLISHING.md rule 14: chart pushes go through the
        # shared action, which retries ghcr.io's "failed to perform Tag ... not found"
        # after an ACCEPTED upload -- and only that. Every other failure still fails on
        # the first attempt, and a second push whose digest differs from the orphaned one
        # fails rather than tagging blind.
        #
        # LOCATE mode (no inputs) rather than push mode, because this job pushes every
        # chart it finds in one loop; push mode is one archive per step. The action needs
        # helm on the runner, which `Install Helm` above provides, and push.sh reads the
        # manifest back using the same credentials, which is why the env below is on the
        # pushing step.
        uses: krateo-platformops/.github/.github/actions/chart-push@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

      - name: Package and push every chart
        env:
          CHART_PUSH: ${{ steps.chart-push.outputs.path }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p charts-dist
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path '*/tests/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"

            # A blueprint archive must be SELF-DESCRIBING: the publishing standard requires
            # values.schema.json and compositiondefinition.yaml at the archive root, because
            # the Marketplace reads the archive and nothing else. Ours lives one directory
            # above the chart, so copy the already-stamped file in.
            src=""
            [ -f "$dir/compositiondefinition.yaml" ] && src="$dir/compositiondefinition.yaml"
            [ -z "$src" ] && [ -f "$(dirname "$dir")/compositiondefinition.yaml" ] \
              && src="$(dirname "$dir")/compositiondefinition.yaml"
            if [ -n "$src" ] && [ "$src" != "$dir/compositiondefinition.yaml" ]; then
              cp "$src" "$dir/compositiondefinition.yaml"
              echo "copied $src into the chart directory"
            fi

            helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination charts-dist

            # CHECK THE ARCHIVE, not the directory. `helm package` succeeds whether the file
            # is there or not, which is exactly how two org charts shipped a
            # CompositionDefinition pinned to someone else's version.
            tgz="charts-dist/${name}-${VERSION}.tgz"
            for want in "${name}/values.schema.json" "${name}/compositiondefinition.yaml"; do
              tar -tzf "$tgz" | grep -qx "$want" || {
                echo "::error::${tgz} does not contain ${want}"; exit 1; }
            done
            # And the CD inside the archive must name THIS version, not a literal left behind.
            cdver=$(tar -xzOf "$tgz" "${name}/compositiondefinition.yaml" \
                    | awk '/version:/{print $2; exit}')
            [ "$cdver" = "${VERSION}" ] || {
              echo "::error::${tgz}: CompositionDefinition says version ${cdver}, tag is ${VERSION}"
              exit 1; }
            echo "archive verified: schema + CompositionDefinition present, CD version ${cdver}"

            bash "${CHART_PUSH}" "$tgz" "${OCI_REPO}"
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            echo "::endgroup::"
          done

      - name: Hand the chart tarballs to the index job
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: charts-dist/*.tgz
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinition on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs after the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Stage into a fresh dir so a root-level CD is never
          # cp'd onto itself (an error, not a no-op — a lesson from selfservice 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
            done < "${CD_MANIFEST}"
            # An absent manifest is NOT "nothing to publish": it means the stamp step never
            # recorded the set, and attaching no CD because a file went missing is the same
            # silent-success shape this workflow guards against elsewhere.
            [ -s "${CD_MANIFEST}" ] || {
              echo "::error::${CD_MANIFEST} is absent or empty, so the pristine"
              echo "::error::CompositionDefinition set was never recorded. Refusing to publish"
              echo "::error::assets from a re-walk of a tree the packaging step has written to."
              exit 1; }
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          # Not `view || create`: release-notes creates the same release on the same tag push, and losing
          # that race failed glance-kog 0.1.2 (422 "already exists"). The script treats a concurrent create
          # as success and still fails on any other error (hack/test-publish-release-assets.sh).
          bash hack/publish-release-assets.sh "${VERSION}" "${assets[@]}"
          echo "attached: ${assets[*]}"

  # Second half of the standard's rule 1: the same bytes also reach the helm index here,
  # because the Marketplace installs from the index and never re-resolves against GHCR.
  #
  # MUST BE PINNED BY FULL COMMIT SHA, with ITS OWN version as the trailing comment --
  # not a version named here, which is a second copy that goes stale the next time the
  # pin moves. This line said `# 1.0.0` while the pin below reached 1.4.3.
  # This workflow receives CHARTS_PUBLISH_TOKEN, an org-wide write token, so a moving
  # major tag would hand that token to whatever `1` points at next.
  #
  # Pinned to the commit the tag below points at, verified rather than taken on trust.
  # RECORD THE COMMAND, NOT ITS OUTPUT (krateo-blueprints/charts PUBLISHING.md, charts#31):
  #
  #   git ls-remote https://github.com/krateo-blueprints/charts 'refs/tags/<X.Y.Z>^{}'
  #
  # Peel with `^{}`: the bare ref returns the annotated TAG OBJECT, not the commit, so
  # verifying a pin against it reports a mismatch that is not one.
  #
  # A SHA pasted here would be a SECOND COPY that nothing updates, and it had already gone
  # stale: this comment recorded a verification of 1.0.2 while the `uses:` line below was
  # bumped to 1.4.0 and then 1.4.2 the same day. The pin's own line is the single source.
  #
  # 1.0.1 fixed the token-in-a-URL defect that half-published github-provider-kog 0.7.6,
  # and then showed a second one on the first green run. The publisher clones gh-pages,
  # merges the new chart in and pushes; two repos publishing in the same minute make the
  # second push lose a race and fail with `fetch first`. Measured, not predicted:
  # openstack-as-a-service 0.3.37 (run 42414460552) took steps 1-12 green and was refused
  # at step 13. Its re-run went green on all 16, which worked only because the cause was
  # OUTSIDE the publisher -- a re-run reuses the old pin, so it cannot recover from a
  # publisher defect. 1.0.2 re-clones and retries.
  #
  # That failure leaves the version in GHCR and absent from the index until the re-run, so
  # it is a half-published state of the kind rule 1 exists to prevent -- recoverable, but
  # only by someone who notices.
  #
  # NOT 1.0.0. That release interpolated the token into a git clone URL, so a value
  # carrying whitespace failed at its "Clone gh-pages" step AFTER the caller's GHCR push.
  # github-provider-kog 0.7.6 (run 42411357647) was left half-published that way on
  # 2026-11-07. 1.0.1 keeps the token out of URLs and refuses a whitespace-bearing value
  # itself. The caller-side check above is still the only one that runs BEFORE the push.
  #
  # The `^{}` matters. 1.0.0 is an ANNOTATED tag, so `refs/tags/1.0.0` resolves to the tag
  # OBJECT (54acb674...), not to a commit, and Actions will not run a workflow pinned to
  # one. The dereferenced commit is the only correct value here.
  #
  # Tag `1` still does not exist, so the `@1` this replaces was never resolvable at all.
  # .github/dependabot.yml is already in place to bump the pin, which is the other half of
  # the trade -- a SHA pin with nothing to update it is permanently stale.
  publish-to-index:
    needs: package-and-push
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
