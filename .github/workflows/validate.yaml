name: validate

# The gate this repository was missing. Every serious defect found so far -- the
# oasPath regex, the CRD version derivation, the RBAC watch verb, the Configuration
# query fields, the separate CRD chart -- was invisible to review and surfaced only
# on a real cluster. So the smoke job is not optional garnish: it is the job that
# would have caught five of the seven.
#
# No Aruba credentials are involved. A RestDefinition reaching Ready is oasgen-provider
# generating a CRD and starting a controller; it never calls the Aruba API. That is
# precisely what makes this runnable on every PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the provider the RestDefinitions are validated against. Bumping this is a
  # deliberate act with a visible diff, not something that drifts under us on a
  # Tuesday -- and the smoke job re-proves all 36 against the new version.
  #
  # THE FLOOR, which is a requirement and not a preference:
  #   0.35.0  libopenapi v0.21.9, so profile.json can be PARSED at all (a `+` in a
  #           schema name made it unparseable); without it AiKey does not merely
  #           fail, it never appears, and nothing reports why
  #   0.36.0  #236  an update verb on a resource with a PUT and no POST now derives
  #           its spec from the update body. AiKey is the only such resource here,
  #           and below this its PUT would silently drop `location` and `tags`
  # `profile` is in the provider list, so a pin below 0.36.0 ships an AiKey that is
  # wrong or absent. See scripts/providers.py.
  #
  # CURRENT PIN: 0.84.0   <- must equal OASGEN_VERSION below; validate.py enforces it
  #
  # THE 0.52.0 STEP (historical -- this block said "THE PIN, 0.52.0" until 2026-11-18,
  # which was true when written and false for the fifteen releases after the pin moved):
  #   0.52.0  #424  OAS 3.0 `nullable: true` and `minProperties` reach the CRD --
  #           these documents are 3.0.1 and this closes evolution-doc item A1
  #           #421  a fieldMapping no longer deletes the spec property it reads
  #           from; every get/update/delete here uses requestFieldMapping
  #           #456  an excludedSpecFields entry matching nothing is now reported
  #
  # NOT 0.53.0, deliberately: it bumps plumbing v1.14.2 -> v1.27.0, which stamps
  # `default: {}` on 240 optional object paths across these 36 definitions --
  # measured. One of them is Vpc.spec.properties, whose `default` child defaults to
  # TRUE and may be held by only one vpc per region. oasgen 0.53.0 does not set
  # Options.NoParentDefaults. See docs/oasgen-provider-evolution.md for the probe,
  # its positive control, and what declining 0.53.0 costs (#475's RBAC fix).
  #
  # Earlier history, kept because it is the reason the floor is where it is:
  #   0.23.0  #109  dotted selectors emitted nested, so LoadBalancer/CloudServer
  #                 findby can match at all
  #   0.25.0  #146  response envelope unwrapped
  #   0.26.0  #148  jq-shaped request bodies
  #   0.26.1  #166  credential headers redacted in logs
  #   0.28.0  #178  raises the chart floor to Kubernetes 1.36, which forces the node
  #                 image up in the same breath -- taken on purpose, see node_image
  OASGEN_VERSION: "0.84.0"

jobs:
  validate:
    name: static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # The generators and validator parse and emit YAML; PyYAML is the only
        # third-party dependency any of them has.
        run: pip install --quiet pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: scripts/validate.py
        # Enforces: the vendored OAS is byte-for-byte unmodified (sha256 vs
        # CHECKSUMS.txt), every verb path+method exists in its document, every
        # requestFieldMapping.inPath is a real path parameter, async poll paths
        # match verbatim and carry their {handleParam}, oasPath satisfies the CRD
        # regex, sample apiVersions match the derived CRD versions, and every chart
        # lints and renders.
        run: python3 scripts/validate.py

      - name: Generators are deterministic
        # The committed artefacts must be exactly what the generators produce. If
        # someone hand-edits a generated RestDefinition, the next regeneration
        # silently reverts it -- better to fail here than to lose the change later.
        run: |
          python3 scripts/generate_restdefinitions.py
          python3 scripts/gen_configmaps.py
          python3 scripts/gen_samples_and_coverage.py
          python3 scripts/gen_provider_docs.py
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the committed ones. Re-run the scripts in scripts/ and commit the result."
            git diff --stat
            git diff
            exit 1
          fi

  pin-not-retracted:
    name: pin not retracted
    # The local gate in scripts/pin_verify.sh only protects whoever RUNS it. A pull
    # request that edits the pin never executes that script, so a bump to a version the
    # producer has retracted would pass review with every check green. This is the gate
    # for the change rather than for the run.
    #
    # WHY IT IS CONDITIONAL, which is the whole design. check_retracted.py fetches
    # oasgen's retracted-versions.yaml and FAILS CLOSED -- a fetch error exits 2, because
    # "could not read the retraction list" is not evidence that a version is safe. Running
    # that on every pull request would make every PR in this repo depend on
    # raw.githubusercontent being reachable, and a gate that goes red for unrelated reasons
    # is a gate people learn to re-run until it passes.
    #
    # So: on a PULL REQUEST it runs only when a file that NAMES the pin changed, which is
    # exactly when the answer can have changed by our own hand. On PUSH TO MAIN it always
    # runs, which catches the other direction -- a retraction published AFTER our pin was
    # set, where nothing in this repo changed at all. A flake on main blocks nobody, so the
    # fail-closed behaviour costs nothing there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the base commit, to see whether the pin files changed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Did this change touch a file that names the pin?
        id: touched
        # Context values go through the environment, never interpolated into the script
        # body: `${{ }}` inside `run:` is how a workflow gets a shell injection, and a
        # SHA being harmless today is not a reason to write the unsafe form.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "not a pull request, so checking the pin unconditionally"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            # No base to diff against means we cannot tell WHETHER the pin changed, and
            # the safe answer to that is to check it, not to skip it.
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "no base SHA available; checking the pin rather than assuming it is untouched"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD || true)"
          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/validate\.yaml|scripts/pin_verify\.sh|scripts/check_retracted\.py)$'; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "a file naming the pin changed in this PR:"
            printf '%s\n' "$changed" | grep -E '^(\.github/workflows/validate\.yaml|scripts/pin_verify\.sh|scripts/check_retracted\.py)$'
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "no file naming the pin changed; the producer list is not consulted"
          fi

      - name: Is ${{ env.OASGEN_VERSION }} retracted by its producer?
        if: steps.touched.outputs.run == 'yes'
        # exit 0 not retracted / 1 RETRACTED / 2 could not tell. All three are honoured as
        # the script defines them: 2 fails the job on purpose.
        run: python3 -I scripts/check_retracted.py "${OASGEN_VERSION}"

  smoke:
    name: kind smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # Declared here, not inherited. This job already runs
        # `scripts/assert_auth_crds.py`, which imports only the standard library, so
        # until now the job never had to say what Python it needs and the runner's
        # system python3 was enough. `scripts/check_samples.py` imports PyYAML. Relying
        # on the runner image happening to ship python3-yaml would make a sample gate
        # fail for a reason that has nothing to do with the samples -- and the whole
        # point of the two steps below is that a sample gate's result means something.
        # Same two lines as the `static validation` job, on purpose.
        run: pip install --quiet pyyaml

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aruba-ci
          # Pinned, for the same reason OASGEN_VERSION is: an unpinned node image
          # means the Kubernetes version this smoke actually proves drifts with
          # whatever helm/kind-action defaults to that week.
          #
          # RAISED TO 1.36 WITH THE 0.34.0 PIN, in the same commit, because the two
          # cannot move independently. Measured from the published charts rather than
          # inferred:
          #     oasgen-provider 0.27.1  kubeVersion: '>=1.33.0-0'
          #     oasgen-provider 0.34.0  kubeVersion: '>=1.36.0-0'
          # The floor rose in chart 0.28.0 (oasgen#178): version-scoped watching needs
          # a MutatingAdmissionPolicy that 1.33-1.35 do not serve. On a 1.33 node Helm
          # refuses the chart outright, and the job would fail for a reason that has
          # nothing to do with the RestDefinitions it exists to test.
          #
          # This is a real cost passed to users, not just to CI: installing this
          # blueprint now requires Kubernetes >= 1.36. It was taken deliberately, to
          # get oasgen#227 (per-verb oasPath reaching the controller, which is what
          # makes CloudServer's create reachable at all) and #225 (an appended
          # additionalStatusFields entry actually regenerating an existing CRD, which
          # is what makes our status.error append take effect).
          node_image: kindest/node:v1.36.4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install oasgen-provider
        run: |
          helm install oasgen-provider-crds \
            oci://ghcr.io/krateo-platformops/charts/oasgen-provider-crds \
            --version "${OASGEN_VERSION}" --namespace krateo-system --create-namespace --wait
          helm install oasgen-provider \
            oci://ghcr.io/krateo-platformops/charts/oasgen-provider \
            --version "${OASGEN_VERSION}" --namespace krateo-system --wait --timeout 5m

      - name: Apply OAS ConfigMaps and RestDefinitions
        run: |
          kubectl apply -n krateo-system -f configmaps/
          # -n krateo-system is NOT decoration. The manifests declare no namespace, so
          # without it they land in `default` -- and oasgen deploys each generated
          # controller into its RestDefinition's own namespace, so all 34 controllers
          # follow them there. The readiness check below counts with -A, so this job
          # stayed green for the whole life of the repo while proving a layout nobody
          # installs: docs/usage.md, the Helm chart and the live clusters all put these
          # in krateo-system. Caught 2026-10-20 by mirroring this job locally and
          # counting in krateo-system, where the answer was 0/34.
          kubectl apply -n krateo-system -R -f restdefinitions/

      - name: Every RestDefinition reaches Ready
        run: |
          set -uo pipefail
          # THE SAME SELF-DISARMING SHAPE AS THE SAMPLES AND CHART LOOPS BELOW, and the
          # third instance in this file. The old line was:
          #
          #     expected=$(find restdefinitions -name '*.yaml' | wc -l | tr -d ' ')
          #
          # With `restdefinitions/` missing or empty, `expected` is 0. `ready` is also 0,
          # because `grep -c '^True$'` over no output is 0 and the `|| true` swallows its
          # exit 1. So `[ "0" = "0" ]` matches on the FIRST pass and the loop breaks
          # immediately. Measured, with no directory and no cluster:
          # `iterations=1 exit=0` -- the step passes having waited for nothing, after
          # printing "expecting 0 RestDefinitions to become Ready" and "ready 0/0". The
          # zero is on screen, which is better than hiding it, and it is still green.
          #
          # Counting FILES was also a proxy for the wrong thing. The comparison is against
          # RestDefinition objects in the cluster, so a single file holding two
          # definitions would make `expected` one too low, `ready` would reach it while a
          # definition was still rolling out, and the loop would break EARLY -- green,
          # with an unready controller. Today 36 files hold exactly 36 documents (measured),
          # so the proxy is currently exact; it is the kind of exactness that stops being
          # true without anyone editing this line. Count the declarations instead.
          [ -d restdefinitions ] || {
            echo "::error::restdefinitions/ is not a directory. This step exists to wait"
            echo "::error::for every RestDefinition to become Ready; with no directory it"
            echo "::error::would wait for none and pass. If the tree moved, update this step."
            exit 1; }
          expected="$(grep -rhoE '^kind: RestDefinition$' restdefinitions --include='*.yaml' | wc -l | tr -d ' ')"
          [ "${expected}" -gt 0 ] || {
            echo "::error::found 0 RestDefinition declarations under restdefinitions/."
            echo "::error::A green result here would mean only that nothing was waited for."
            exit 1; }
          echo "expecting ${expected} RestDefinitions to become Ready"

          # Poll rather than `kubectl wait`: each RestDefinition generates a CRD and
          # rolls out a controller Deployment, so the set becomes Ready gradually and
          # a per-object wait would serialise what is actually happening in parallel.
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            ready=$(kubectl get restdefinitions.ogen.krateo.io -A \
              -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              2>/dev/null | grep -c '^True$' || true)
            echo "  ready ${ready}/${expected}"
            [ "${ready}" = "${expected}" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::only ${ready}/${expected} RestDefinitions became Ready within 10m"
              kubectl get restdefinitions.ogen.krateo.io -A
              # Select the FAILURES, do not head-truncate everything. The previous
              # form was `-o yaml | grep -A10 'conditions:' | head -100`, which dumps
              # every definition in cluster order and cuts off long before the
              # interesting one -- on the run that caught arubacloud-profile-aikey it
              # printed 100 lines of healthy Ready=True blocks and not one word of the
              # single resource that failed, so the error had to be guessed at.
              echo "--- definitions that are not Ready ---"
              kubectl get restdefinitions.ogen.krateo.io -A -o json | jq -r '
                .items[]
                | select((.status.conditions // []) | any(.type=="Ready" and .status!="True"))
                | "=== \(.metadata.namespace)/\(.metadata.name)\n\(.status.conditions)"'
              # Generation emits warnings as EVENTS (BuiltInNameCollision,
              # ApiRefWithoutSnowplow, schema mismatches). A reason the condition does
              # not carry is often sitting here instead.
              echo "--- warning events in krateo-system ---"
              kubectl -n krateo-system get events --field-selector type=Warning \
                --sort-by=.lastTimestamp | tail -40 || true
              kubectl -n krateo-system logs deploy/oasgen-provider --tail=200 || true
              exit 1
            fi
            sleep 15
          done

      - name: Each Configuration CRD exposes EXACTLY its document's auth method
        # From the openstack-nova-operator-kog session. The load-bearing idea is
        # theirs: the comparison is EQUALITY, not membership.
        #
        #     got == ["apiKey"]      a completeness assertion
        #     "apiKey" in got        passes on a CRD that ALSO carries bearer
        #
        # Membership cannot see the interesting failure -- a document generating BOTH
        # methods -- and nor can the rejection evidence this repo already has. A
        # published 0.2.0 chart sent authentication.bearer to three resources whose
        # document declares apiKey and the API server refused it; that proves the
        # wrong thing is REFUSED, while this proves there is nothing wrong to reach
        # for. Complementary, and neither subsumes the other.
        #
        # The expectation is derived from the same OAS the generator reads, so it
        # cannot drift from the documents: 7 of the 12 provider documents declare
        # apiKey in:header, 5 declare http/bearer. Reads only; no vendor API.
        #
        # Gates on each CRD's Established condition rather than the RestDefinition's
        # Ready -- nova measured Ready going true BEFORE the CRDs exist, twice
        # (oasgen-provider#314), so reading off Ready is a race that fails as absent.
        # No KUBE_CONTEXT: every other step in this job uses the ambient context
        # that kind-action sets, and hardcoding `kind-aruba-ci` here would be a
        # second place for the cluster_name to drift out of step with.
        run: python3 scripts/assert_auth_crds.py

      - name: Samples are accepted by the generated CRDs
        # The generated CRDs use strict decoding, so this catches a sample whose
        # apiVersion or field set no longer matches what oasgen generated -- the
        # exact class of break that hit all 34 samples once already. Server-side
        # dry-run validates against the live schema without creating anything, in
        # Kubernetes or at Aruba.
        run: |
          set -uo pipefail
          fail=0
          # SAME SELF-DISARMING SHAPE AS THE CHART LOOP BELOW, found by sweeping this
          # file after fixing that one. `for f in $(find samples ...)` over a missing or
          # empty `samples/` iterates ZERO times, leaves fail=0, and exits 0 having
          # validated nothing -- and `find`'s own error about the missing directory goes
          # to stderr inside a command substitution, where its exit status is discarded.
          # Measured: `iterations=0 fail=0`.
          #
          # scripts/check_samples.py refuses this case explicitly ("NOTHING WAS CHECKED.
          # A clean result here would mean nothing."). It used to be a MANUAL tool that
          # ran in no workflow -- which is why this loop had to carry the whole weight
          # and had to stop passing empty. It now runs in the two steps below, so this
          # loop is no longer the only sample gate. It still must not pass empty: this
          # is the apiserver's own verdict, and the apiserver is the authority on what
          # it will accept. The steps below are not a replacement for it.
          [ -d samples ] || { echo "::error::samples/ is not a directory"; exit 1; }
          n_samples="$(find samples -name '*.yaml' | wc -l | tr -d ' ')"
          echo "samples to validate: ${n_samples}"
          [ "${n_samples}" -gt 0 ] || {
            echo "::error::found 0 sample YAML files under samples/. A green result here"
            echo "::error::would mean only that nothing was looked at. If samples moved,"
            echo "::error::update this step."
            exit 1; }
          for f in $(find samples -name '*.yaml'); do
            if ! out=$(kubectl apply --dry-run=server -f "$f" 2>&1); then
              echo "::error file=${f}::${out}"
              fail=1
            fi
          done
          echo "validated ${n_samples} sample(s) against the generated CRDs"
          exit $fail

      - name: The sample type-check can disagree
        # The control for the step that follows, and it runs FIRST so that a green
        # result below cannot be read without it. `--prove` builds eight synthetic
        # sample/CRD pairs in memory -- no cluster, no CRDs, no samples -- and requires
        # the comparison to complain about six and stay quiet on two. If the comparison
        # ever goes inert, this fails here and the step below never gets to report a
        # clean run over 72 CRs that it did not really examine.
        #
        # Two of the six are the breaks that justified writing the script: Aruba ships
        # `KaasPropertiesDto.autoscalerProfile` and `AlertInfo.theshold` as bare
        # `{"nullable": true}` with no `type`, a structural CRD must give every node a
        # type, so both become `type: object` and a sample sending a string into them is
        # wrong. We do not touch Aruba's OAS, so this is permanent.
        run: python3 scripts/check_samples.py --prove

      - name: Samples type-check against the generated CRDs
        # NOT a second opinion on the dry-run above. It reads the same CRDs out of the
        # same cluster and asks two things the apiserver does not answer:
        #
        #   1. A DENOMINATOR. The loop above prints "validated 73 sample(s)" and means
        #      73 FILES. Measured on this tree: 73 files hold 75 YAML documents --
        #      samples/container/kaas.yaml and samples/database/databaseuser.yaml carry
        #      two each -- of which 72 are CRs in arubacloud.ogen.krateo.io and 3 are
        #      prerequisite `v1` Secrets. So the figure the loop prints is not the
        #      number of provider CRs it proved anything about, and the two differ by
        #      more than one. This step prints `indexed N (group, version, kind)`,
        #      `checked N sample CR(s)` and `not ours to check (N)`, and FAILS on a
        #      sample in our group with no CRD to check against -- which is the
        #      difference between "nothing was wrong" and "nothing was looked at".
        #
        #   2. A null on a NON-NULLABLE field. The apiserver PRUNES it: the dry-run
        #      above passes, the field silently disappears, and any default applies
        #      instead. That failure is invisible to `kubectl apply --dry-run=server`
        #      by design, and it is not hypothetical here -- a partial `spec.properties`
        #      already makes a Vpc claim the region-unique default role at the current
        #      pin.
        #
        # No --context, for the reason the auth-CRD step above gives: every step in this
        # job uses the ambient context kind-action sets, and naming it here would be a
        # second place for cluster_name to drift. No --partial: this cluster has all 36
        # RestDefinitions applied, so a missing CRD is a failure and not a known gap.
        run: python3 scripts/check_samples.py --from-cluster

      - name: Composition charts render against the generated CRDs
        # The gap that let a broken chart ship twice. `helm lint` and `helm template`
        # both pass on a chart that no cluster will accept -- neither knows what a CRD
        # contains. The published 0.2.0 chart sent apiVersion v1alpha1 where the CRDs
        # serve v1-0-0, authentication.bearer to three resources whose document
        # declares apiKey, query verbs to a Configuration that has none, and
        # properties.network to a Vpc whose create body is {default, preset}. Every
        # one of those renders cleanly and every one is rejected by the API server.
        #
        # So the chart is now applied, server-side dry run, against the CRDs this very
        # job generated. Nothing is created, in Kubernetes or at Aruba.
        run: |
          set -uo pipefail
          fail=0
          # EXPLICIT LIST, NOT A GLOB, and no `|| continue` on a missing chart.
          # This was `for chart in compositions/*/` with a `[ -f ... ] || continue`
          # guard. With no `nullglob`, a glob that matches nothing stays LITERAL, so the
          # loop iterated once, the guard skipped it, `fail` stayed 0 and this job went
          # green having checked nothing -- the one gate that exists because a broken
          # chart shipped twice, silently disarmed by moving a directory. Measured on
          # this branch (`iterations=1 fail=0`), not inferred.
          #
          # REPOSITORY.md R2 fixes the set of shipped charts, so the paths are named.
          # `chart/` is required; `config-chart/` is checked only if present.
          [ -f chart/Chart.yaml ] || {
            echo "::error::chart/Chart.yaml is missing. R2 requires the shipped chart at"
            echo "::error::chart/. If it moved, update this loop AND validate.py's"
            echo "::error::SHIPPED_CHARTS -- neither follows the chart."
            exit 1; }
          for chart in chart/ config-chart/; do
            [ -f "${chart}Chart.yaml" ] || continue
            work=$(mktemp -d)
            cp -r "$chart" "$work/c"
            # Same placeholder substitution validate.py does: the tree never holds a
            # version, so an unstamped chart cannot be rendered as-is.
            sed -i "s/^version: CHART_VERSION$/version: 0.0.0/" "$work/c/Chart.yaml"
            if ! rendered=$(helm template ci "$work/c" 2>&1); then
              echo "::error file=${chart}Chart.yaml::render failed: ${rendered}"
              fail=1; continue
            fi
            if ! out=$(printf '%s' "$rendered" | kubectl apply --dry-run=server -f - 2>&1); then
              echo "::error file=${chart}Chart.yaml::rejected by the generated CRDs: ${out}"
              fail=1
            else
              echo "  ${chart} accepted by the generated CRDs"
            fi
          done
          exit $fail

      - name: Provider logged no errors
        # A controller that starts, serves, and logs errors on every reconcile still
        # reports Ready. The RBAC watch defect looked exactly like this.
        run: |
          if kubectl -n krateo-system logs deploy/oasgen-provider --tail=-1 \
               | grep -iE '"level":"(error|fatal)"' | head -20 | grep .; then
            echo "::error::oasgen-provider logged errors"
            exit 1
          fi
          echo "clean"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n krateo-system logs deploy/oasgen-provider --tail=300 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
