# Publishes this repo's charts on a semver tag: to GHCR, and into the krateo-blueprints
# helm index. Replaces release-tag.yaml, whose five pre-push guards are now in the shared
# workflow rather than in a private copy here -- R5 of krateo-blueprints' REPOSITORY.md.
#
# WHAT MOVED AND WHAT DID NOT. release-tag.yaml did three things; release-oci absorbs two:
#
#   package-and-push   -> the shared workflow. Its guards supersede the five this repo kept:
#                         index credential present, no whitespace in it, the index content
#                         gate run BEFORE the push, the preflight ordered by `needs:` rather
#                         than by step order, and an unstamped-placeholder check this repo
#                         never had (helm accepts any string as appVersion, so a placeholder
#                         would otherwise package, push AND publish).
#   publish-to-index   -> the shared workflow, since 2.1.0. A caller that also published
#                         would DOUBLE-PUBLISH, which is why that job is gone rather than
#                         kept "just in case".
#   release assets     -> STAYS HERE, below, and must. A called workflow's permissions are
#                         capped at its caller's and custom secrets are not inherited down a
#                         nested call, so a job inside release-oci could never write a
#                         release body. release-oci documents this as the pattern and does no
#                         release-asset handling at all.
#
# THE PIN IS A COMMIT, NOT A TAG, and the comment form is not cosmetic: this repo's
# pinned-uses check accepts only `# X.Y.Z` or `# main YYYY-MM-DD` (verified against the
# regex at the 1.4.3 this repo pins, not only at main). The upstream's own suggested
# comment carried a full timestamp, which that check REFUSES -- so the date here is the
# commit's date, to the day.
#
# TRANSITIONAL FORM. `# main 2026-11-22` is the branch-commit form, used because 2.1.0 is
# not tagged yet: acmp tags it on THIS SAME commit once this repo's first index-path release
# passes, after which only the comment changes to `# 2.1.0` and the SHA stays put. What was
# tested is then byte-for-byte what is released.
#
# DO NOT BUMP THIS PIN UNTIL `2.1.0` EXISTS ON aa90d48, INCLUDING VIA DEPENDABOT. This
# repo's dependabot watches github-actions and will offer newer commits of this very
# workflow -- upstream main has already moved past aa90d48 (chart-push pin tests, a helm pin
# in security.yml, and a 2.2.0 candidate). Merging such a bump before the release would
# delete the thing the release exists to prove: acmp tags 2.1.0 on the commit THIS repo's
# first index-path run validated, and a run against a different commit tags nothing. None of
# those newer commits touch the index path, so there is no benefit to taking them early and a
# real cost to it. After the tag lands, bumping is ordinary again.
#
# WHY THIS SHA AND NOT AN EARLIER ONE -- three candidates were superseded before anyone
# pinned them, and the second is the instructive one:
#   3892b82c  the indexing scope question was still open
#   b030d3f9  announced with main's CI GREEN ON ALL 7, and still failed package-and-push at
#             JOB SETUP for every caller: it staged krateo-blueprints/charts as a step action
#             and a dangling-symlink fixture broke the archive unpacking. A shared workflow's
#             own CI cannot see this -- action staging happens in the CALLER's job -- so
#             "upstream CI is green" is not evidence that a caller will start. A caller dry
#             run is. RUN ONE BEFORE THE FIRST TAG.
#   7da11cb6  indexed only charts PUSHED in that run, so a release that pushed and then
#             failed to index could never be finished by re-running it (the re-run skips the
#             push, so it skipped the index). 2.1.0 indexes every chart of the release.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: package and gate everything, push and index nothing."
        type: boolean
        # TRUE BY DEFAULT ON PURPOSE. A manual run is almost always a rehearsal, and the
        # expensive mistake is a dispatch that publishes. A tag push is unaffected: the
        # expression below resolves to false for `push`.
        default: true

jobs:
  release:
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@aa90d48e1a101d5e9b3e547bca116b97c49513b5 # main 2026-11-22
    with:
      # REQUIRED since 2.0.0, and required for a reason worth keeping: an optional input
      # whose absence silently skipped the index credential check meant a chart left out of
      # the index was an omission rather than a decision. `none` is the explicit way to say
      # "deliberately not indexed".
      index_channel: blueprints
      # MUST be set explicitly. The default is oci://ghcr.io/krateo-platformops/charts and
      # this repo publishes to krateo-blueprints. Since 2026-11-22 index-preflight REFUSES
      # the mismatch for the blueprints and pages channels, compared as written so an
      # old-org spelling is refused too -- so forgetting fails the preflight rather than
      # publishing into another org's namespace. Set it anyway; the refusal does not cover
      # `index_channel: none`.
      oci_repo: oci://ghcr.io/krateo-blueprints/charts
      # false for a tag push, the dispatch input for a manual run.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      # Tested for presence and for whitespace anywhere before anything is pushed, then used
      # by the index publish. A green check proves PRESENCE AND SHAPE, NOT VALIDITY: an
      # expired or wrongly scoped token still fails at index time. It is an ORGANISATION
      # secret, visible to this repo -- `gh secret list` shows repo secrets only and returns
      # nothing here, which is not evidence of absence.
      charts_publish_token: ${{ secrets.CHARTS_PUBLISH_TOKEN }}

  # The stamped CompositionDefinition, attached to the GitHub release. Top-level, for the
  # permissions reason in the header.
  release-assets:
    needs: [release]
    # Tags only. A dispatch -- rehearsal or not -- has no release to attach to, and guarding
    # on the event rather than on `dry_run` means a dispatch with dry_run=false still cannot
    # touch a release.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # THE SOURCE OF THE CD CHANGED, and the new one is better. release-tag.yaml recorded a
      # manifest of CD paths during its own stamp step, because it refused to "publish assets
      # from a re-walk of a tree the packaging step has written to". That stamp step now lives
      # in release-oci, so the manifest is gone -- and the packages themselves are a stronger
      # source: the CD inside the archive is the stamped file that was actually pushed, not a
      # pre-packaging copy of it.
      - name: Download the packages this release pushed
        uses: actions/download-artifact@v4
        with:
          name: release-oci-charts
          path: dist

      - name: Attach the stamped CompositionDefinition to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.tgz)
          # An empty artifact is NOT "nothing to publish". release-oci uploads the packages in
          # both modes with if-no-files-found: error, so an empty dist/ here means the
          # download or the upload failed, and attaching nothing because a file went missing
          # is the silent-success shape this repo guards against everywhere else.
          [ ${#pkgs[@]} -gt 0 ] || {
            echo "::error::dist/ holds no .tgz, so the release-oci-charts artifact was empty"
            echo "::error::or did not download. Refusing to treat that as 'no assets'."
            exit 1; }
          stage="$(mktemp -d)"; assets=()
          for tgz in "${pkgs[@]}"; do
            # <name>/compositiondefinition.yaml, where <name> is the chart. release-oci packs
            # one from the chart dir OR its parent (ours is compositions/, beside the chart),
            # and refuses to push a package holding more than one.
            cd_path="$(tar -tzf "$tgz" | grep -E '^[^/]+/compositiondefinition\.yaml$' || true)"
            [ -n "$cd_path" ] || { echo "no CompositionDefinition in $(basename "$tgz")"; continue; }
            name="${cd_path%%/*}"
            tar -xzf "$tgz" -C "$stage" "$cd_path"
            # Named for the CHART, not for the directory it was authored in. release-tag.yaml
            # derived this from the parent directory and produced
            # compositiondefinition-compositions.yaml, which names a folder that the pending
            # chart/ migration will rename anyway. A consumer-visible asset rename, called out
            # in the PR rather than slipped in.
            out="compositiondefinition-${name}.yaml"
            mv "$stage/$cd_path" "$stage/$out"
            assets+=("$stage/$out")
          done
          [ ${#assets[@]} -gt 0 ] || { echo "no CompositionDefinition in any package"; exit 0; }
          # Not `view || create`: release-notes.yaml creates the same release on the same tag
          # push, and losing that race failed glance-kog 0.1.2 with 422 "already exists". The
          # script treats a concurrent create as success and still fails on anything else
          # (hack/test-publish-release-assets.sh). THIS REPO WON THAT RACE ONCE WITH NOTHING
          # TO SPARE -- do not simplify it because it looks defensive.
          bash hack/publish-release-assets.sh "${VERSION}" "${assets[@]}"
          echo "attached: ${assets[*]}"
