apiVersion: v2
name: aruba-network-environment
description: >-
  Krateo Composition that provisions an Aruba Cloud network environment
  (VPC + Subnet + SecurityGroup) as a single unit, on top of the proxy-free
  RestDefinitions in this repository. Every field it sends is derived from the
  vendored OAS by scripts/gen_composition.py, and CI applies the rendered chart
  against the generated CRDs so it cannot drift from them.
  CloudServer is deliberately not included, and the original reason no longer
  applies: oasgen#227 shipped in 0.34.0 and its create is proven live. It stays
  out because its update and delete are delegated to Snowplow RESTActions, which
  need four prerequisites the oasgen-provider chart does not provide, and because
  create is refused on a trial account with no way to check eligibility first.
  See scripts/gen_composition.py's KINDS comment for the full reasoning.
type: application
version: CHART_VERSION
# BOTH placeholders, which is REPOSITORY.md R4's default shape, and the literal `1.0.0`
# this replaced is the drift R4 cites: it was hand-maintained, nothing updated it, and
# 0.2.0 through 0.5.0 all published `version: 0.x.0` beside `appVersion: 1.0.0`.
#
# Safe here only because NOTHING CONSUMES IT. Checked before changing it: `.Chart.AppVersion`
# appears nowhere in chart/, and the `rdc.image.tag` derived from an appVersion -- described
# in README.md, docs/usage.md, docs/getting-started.md and docs/troubleshooting.md -- is the
# OASGEN-PROVIDER chart's own appVersion, not this chart's. Four docs say "the chart derives
# rdc.image.tag from its own appVersion" and none of them means this chart.
#
# Making it a placeholder also ACTIVATES a release gate that was dormant: release-oci counts
# the placeholder occurrences in `.appVersion` and only verifies the packaged appVersion
# against the release version when that count is nonzero. With a literal it never checked.
# From now on it does.
#
# (The token is not spelled out in these comments on purpose: the release stamps Chart.yaml
# with a GLOBAL sed, so a comment naming it ships as `grep -c 0.6.0` -- a published artifact
# carrying a comment the release itself corrupted. Verified by running the sed.)
appVersion: CHART_VERSION
# An absolute https icon is required by the krateo-blueprints publishing standard and
# the Marketplace shows it. Krateo's own brand asset rather than Aruba's: hotlinking a
# vendor's logo is not ours to decide. Verified to serve image/svg+xml, and note the
# HYPHENATED org -- krateoplatformops/.github 404s, the same install-source confusion
# scripts/validate.py already screens for in the install docs.
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
# R3: `home` and `sources` both name the publishing repository, and R1 is satisfied as of
# 2026-11-25 -- the repository was renamed from krateo-arubacloud-provider-kog, and these
# three strings moved in the pull request merged immediately after, with no tag between the
# two (REPOSITORY.md, "Changing a published name").
#
# The chart's own `name` did NOT change and never had to: the R3 amendment decoupled it from
# the repository's name, which is why this rename touched no cluster, retired no
# CompositionDefinition and left the published OCI name alone. Versions already published
# (0.1.0 through 0.5.0) keep the old repository in their recorded `sources` and are not
# republished; publish-chart's ownership guard resolves a recorded owner through the GitHub
# API, so a renamed repository still answers for its own chart name.
home: https://github.com/krateo-blueprints/arubacloud-provider-kog
# The annotation R3 asks a chart to carry so the published artifact says where its source
# is without a reader having to resolve `sources`. Same value, deliberately: if the
# repository is renamed, these three strings move in ONE pull request, merged right after
# the GitHub rename with no release tagged in between (REPOSITORY.md, "Changing a published
# name"). A GitHub redirect does NOT satisfy publish-chart, which compares the string.
annotations:
  krateo.io/source-repo: https://github.com/krateo-blueprints/arubacloud-provider-kog
# The publisher REFUSES a chart whose `sources` does not list its publishing
# repository -- that is how it enforces one owner per chart name, so a second repo
# cannot quietly take over `aruba-network-environment`.
sources:
  - https://github.com/krateo-blueprints/arubacloud-provider-kog
keywords:
  # The Marketplace renders these as tags, so they must describe what the chart
  # PROVISIONS. `cloudserver` was here and is removed: the description above spends a
  # paragraph explaining CloudServer is deliberately excluded, so the tag advertised a
  # resource this chart does not create.
  - krateo
  - arubacloud
  - composition
  - vpc
  - subnet
  - securitygroup
