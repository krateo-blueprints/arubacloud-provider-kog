# Registry needs a public IP, a block-storage volume, and an existing subnet + security
# group. All billable, all hourly, all small:
#   Registry Small                   EUR 0.01233/hr
#   ElasticIp                        hourly
#   BlockStorage 20 GB               hourly
#
# `size` takes exactly one of `Small`, `Medium`, `HighPerf` — case-sensitive, and
# MEASURED, not inferred (2026-10-20): each candidate was POSTed with a deliberately
# nonexistent volume uri so nothing could be created, and the Size error either
# appeared or did not. `small` and `SMALL` are both refused; `20`, `100` and `1000`
# are refused too.
#
# This field is undiscoverable from the spec. The create DTO calls it "The number of
# concurrent connections required by user" and the response DTO calls it "the id of
# registry size"; the one catalogue in the OAS, `RegistrySize`, is DEFINED BUT
# REFERENCED BY NO PATH, so no endpoint lists the legal values. An earlier version of
# this file read the first description literally and sent "20", which is why Registry
# had never once been created.
#
# preset: false — preset only works when the location has no VPC, and cloudburst-default
# exists (the same rule that rejected the first Kaas attempt).
#
# NOTE: Registry takes securityGroup.URI, whereas Kaas takes securityGroup.NAME.
name: registry
vars:
  PROJECT: ''
  LOCATION: ITBG-Bergamo
  # This chain used to require VPC_ID, SUBNET_ID and SG_ID from the environment, naming
  # resources that had to already exist in whoever's account ran it. It now builds its own,
  # which is what every other chain here does -- cloudserver.yaml and network-security.yaml
  # both create Vpc -> Subnet -> SecurityGroup inline and need only PROJECT.
  #
  # IT COSTS NOTHING TO DO SO. vpcs, subnets and securitygroups carry no `billingPeriod` in
  # their spec schema; the billable three are the ElasticIp, the BlockStorage and the
  # Registry, unchanged. So the old requirement bought nothing and made the run depend on
  # unknown account state -- three IDs nobody had recorded, which is a blocker discovered at
  # window time rather than before it.
residue:
  - /projects/${PROJECT}/providers/Aruba.Container/registries
  - /projects/${PROJECT}/providers/Aruba.Network/elasticIps
  - /projects/${PROJECT}/providers/Aruba.Storage/blockStorages
  - /projects/${PROJECT}/providers/Aruba.Network/vpcs
resources:
  # Non-billable prerequisites, in dependency order. 10.140.0.0/24 is chosen clear of every
  # other chain's range (cloudserver 10.20.1.0/24, vpn 10.60.0.0/24, network-security
  # 10.120.0.0/24) so two chains can run in one account without colliding.
  - kind: Vpc
    name: ga-reg-vpc
    spec:
      configurationRef: {name: vpc-config, namespace: default}
      projectId: ${PROJECT}
      metadata: {name: ga-reg-vpc, location: {value: "${LOCATION}"}, tags: []}
      properties:
        default: false
        # preset only works where the location has no VPC yet; cloudburst already has one.
        preset: false
    drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:self}

  - kind: Subnet
    name: ga-reg-subnet
    spec:
      configurationRef: {name: subnet-config, namespace: default}
      projectId: ${PROJECT}
      vpcId: ${id:Vpc}
      metadata: {name: ga-reg-subnet, location: {value: "${LOCATION}"}, tags: []}
      properties:
        type: Advanced
        default: false
        network:
          address: 10.140.0.0/24
    drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:Vpc}/subnets/${id:self}

  - kind: SecurityGroup
    name: ga-reg-sg
    spec:
      configurationRef: {name: securitygroup-config, namespace: default}
      projectId: ${PROJECT}
      vpcId: ${id:Vpc}
      metadata: {name: ga-reg-sg, location: {value: "${LOCATION}"}, tags: []}
      properties:
        default: false
        preset: false
    drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:Vpc}/securityGroups/${id:self}
  - kind: ElasticIp
    name: ga-reg-eip
    self: /projects/${PROJECT}/providers/Aruba.Network/elasticIps/${id:self}
    billable: true
    spec:
      configurationRef: {name: elasticip-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-reg-eip, location: {value: "${LOCATION}"}, tags: []}
      properties:
        billingPlan: {billingPeriod: Hour}

  - kind: BlockStorage
    name: ga-reg-vol
    self: /projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:self}
    billable: true
    spec:
      configurationRef: {name: blockstorage-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-reg-vol, location: {value: "${LOCATION}"}, tags: []}
      properties:
        sizeGb: 20
        billingPeriod: Hour

  - kind: Registry
    name: ga-registry
    billable: true
    spec:
      configurationRef: {name: registry-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-registry, location: {value: "${LOCATION}"}, tags: []}
      properties:
        preset: false
        size: Small
        adminUser: {username: gaadmin}
        billingPlan: {billingPeriod: Hour}
        subnet:
          uri: "/projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:Vpc}/subnets/${id:ga-reg-subnet}"
        # Registry takes securityGroup.URI; Kaas takes securityGroup.NAME. Not a typo.
        securityGroup:
          uri: "/projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:Vpc}/securityGroups/${id:ga-reg-sg}"
        publicIp:
          uri: "/projects/${PROJECT}/providers/Aruba.Network/elasticIps/${id:ga-reg-eip}"
        blockStorage:
          uri: "/projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:ga-reg-vol}"
    drift: /projects/${PROJECT}/providers/Aruba.Container/registries/${id:self}
